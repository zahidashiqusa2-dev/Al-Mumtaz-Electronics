<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal — Al-Mumtaz Electronics Hasilpur</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            sans: ['"DM Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            brand: {
              50: '#FFF4EE',
              100: '#FFE5D6',
              500: '#E8531A',
              600: '#C94310',
              700: '#A5350B'
            },
            wa: {
              600: '#0F7B4D',
              700: '#0A5E3A'
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background-color: #F1F5F9;
      color: #0F172A;
    }
    h1, h2, h3, h4, .font-display {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[#F1F5F9] text-slate-900 antialiased">

  <!-- Toast Banner -->
  <div id="toast-banner" class="hidden fixed bottom-5 right-5 z-50 max-w-sm bg-slate-950 text-white px-4 py-3 rounded-xl shadow-xl text-sm font-medium border border-slate-800"></div>

  <!-- 1. ADMIN LOGIN GATE -->
  <section id="admin-login-view" class="min-h-screen flex items-center justify-center px-4 py-12 bg-slate-950">
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-2xl p-7 sm:p-8 space-y-6">
      <div class="space-y-1.5 border-b border-slate-100 pb-4">
        <p class="text-xs font-semibold uppercase tracking-[0.14em] text-brand-500">
          Al Mumtaz Electronics · Hasilpur
        </p>
        <h1 class="font-display text-2xl font-extrabold text-slate-950 tracking-tight">
          Admin Dashboard Sign In
        </h1>
        <p class="text-xs text-slate-600 leading-relaxed">
          Protected by <code class="font-mono text-slate-900">Admin_Username</code> and <code class="font-mono text-slate-900">Admin_Password</code> variables.
        </p>
      </div>

      <form id="admin-login-form" class="space-y-4">
        <div>
          <label for="login-username" class="block text-xs font-semibold text-slate-700 mb-1.5">
            Admin_Username
          </label>
          <input
            id="login-username"
            name="username"
            type="text"
            autocomplete="username"
            required
            placeholder="Enter admin username"
            class="w-full h-10 px-3.5 border border-slate-300 rounded-lg text-sm text-slate-900 focus:border-brand-500 focus:outline-none"
          />
        </div>

        <div>
          <label for="login-password" class="block text-xs font-semibold text-slate-700 mb-1.5">
            Admin_Password
          </label>
          <input
            id="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="Enter admin password"
            class="w-full h-10 px-3.5 border border-slate-300 rounded-lg text-sm text-slate-900 focus:border-brand-500 focus:outline-none"
          />
        </div>

        <div id="login-error-msg" class="hidden p-3 bg-red-50 border border-red-200 rounded-lg text-xs font-semibold text-red-700"></div>

        <button
          id="admin-login-submit"
          type="submit"
          class="w-full h-11 bg-slate-950 hover:bg-slate-800 text-white text-sm font-semibold rounded-lg transition-colors"
        >
          Sign In to Dashboard
        </button>
      </form>

      <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
        <span>Restricted Access (/admin)</span>
        <a href="/" class="font-semibold text-brand-600 hover:underline">Return to Storefront →</a>
      </div>
    </div>
  </section>

  <!-- 2. PROTECTED ADMIN DASHBOARD (No Hero Section · Single Navigation Button) -->
  <div id="admin-dashboard-view" class="hidden min-h-screen flex flex-col">
    <header class="sticky top-0 z-40 bg-slate-950 text-white border-b border-slate-800">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
        <button id="admin-home-btn" type="button" class="text-left min-w-0 focus:outline-none group">
          <span class="block font-display font-extrabold text-base sm:text-lg tracking-tight text-white group-hover:text-brand-100 transition-colors truncate whitespace-nowrap">
            Al Mumtaz Electronics · Admin Dashboard
          </span>
        </button>

        <div class="flex items-center gap-2.5 shrink-0">
          <!-- Single Primary Navigation Button -->
          <button id="admin-nav-toggle-btn" type="button" aria-expanded="false" aria-controls="admin-nav-drawer" class="h-9 px-3.5 bg-brand-500 hover:bg-brand-600 text-white rounded-lg text-xs sm:text-sm font-semibold inline-flex items-center gap-2 whitespace-nowrap shrink-0 transition-colors shadow-sm">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
            <span>Navigation (24)</span>
          </button>

          <a href="/" class="hidden sm:inline-flex h-9 px-3 border border-slate-700 hover:border-slate-500 hover:bg-slate-900 rounded-lg text-xs font-semibold text-slate-200 items-center whitespace-nowrap shrink-0 transition-colors">
            Storefront
          </a>
          <button id="admin-logout-btn" type="button" class="h-9 px-3 border border-slate-700 hover:border-red-500/60 hover:bg-slate-900 text-slate-200 rounded-lg text-xs font-semibold whitespace-nowrap shrink-0 transition-colors">
            Sign Out
          </button>
        </div>
      </div>
    </header>

    <!-- Collapsible 24-Button Admin Navigation Directory -->
    <section id="admin-nav-drawer" class="hidden bg-slate-900 text-white border-b border-slate-800 shadow-2xl">
      <div id="admin-nav-drawer-inner" class="max-w-7xl mx-auto px-4 sm:px-6 py-5 space-y-4"></div>
    </section>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 pb-16 space-y-6">
      <!-- Live KPI Telemetry Strip -->
      <div id="admin-kpi-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3.5"></div>

      <!-- Contextual Workspace Breadcrumb Bar (visible when inspecting a specific feature module) -->
      <div id="admin-workspace-bar" class="hidden bg-white border border-slate-200 rounded-xl px-4 py-3 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <button id="admin-back-dashboard-btn" type="button" class="h-8 px-3 bg-slate-950 hover:bg-slate-800 text-white rounded-lg text-xs font-semibold inline-flex items-center gap-1.5 whitespace-nowrap shrink-0 transition-colors">
            ← Dashboard
          </button>
          <span id="admin-workspace-title" class="text-sm font-display font-bold text-slate-900 truncate"></span>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button id="admin-refresh-btn" type="button" class="h-8 px-3 bg-white border border-slate-300 hover:bg-slate-50 rounded-lg text-xs font-semibold text-slate-800 whitespace-nowrap transition-colors">
            Refresh Data
          </button>
        </div>
      </div>

      <!-- Admin Dashboard Hub / Active Feature Workspace Container -->
      <div id="admin-tab-content"></div>
    </main>
  </div>

  <!-- ORDER DETAILS MODAL -->
  <div id="order-detail-modal" class="hidden fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-200 relative">
      <button id="order-detail-close-btn" type="button" aria-label="Close order details" class="absolute right-4 top-4 w-8 h-8 rounded-lg border border-slate-200 bg-white hover:bg-slate-100 flex items-center justify-center text-slate-700 font-bold">
        ✕
      </button>
      <div id="order-detail-body" class="p-6 space-y-5"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
