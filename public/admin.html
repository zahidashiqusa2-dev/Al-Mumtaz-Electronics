<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal — Al-Mumtaz Electronics Hasilpur</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            sans: ['"DM Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            brand: {
              50: '#FFF4EE',
              100: '#FFE5D6',
              500: '#E8531A',
              600: '#C94310',
              700: '#A5350B'
            },
            wa: {
              600: '#0F7B4D',
              700: '#0A5E3A'
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background-color: #FAFAFA;
      color: #111827;
    }
    h1, h2, h3, h4, .font-display {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[#FAFAFA] text-[#111827] antialiased">

  <!-- Toast Banner -->
  <div id="toast-banner" class="hidden fixed bottom-5 right-5 z-50 max-w-sm bg-gray-900 text-white px-4 py-3 rounded shadow-xl text-sm font-medium border border-gray-700"></div>

  <!-- 1. ADMIN LOGIN GATE -->
  <section id="admin-login-view" class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md bg-white border border-gray-200 rounded shadow-sm p-7 sm:p-8 space-y-6">
      <div class="space-y-1.5 border-b border-gray-100 pb-4">
        <p class="text-[11px] font-semibold uppercase tracking-[0.14em] text-brand-500">
          Al-Mumtaz Electronics · Hasilpur
        </p>
        <h1 class="font-display text-2xl font-extrabold text-gray-950 tracking-tight">
          Admin Portal Sign In
        </h1>
        <p class="text-xs text-gray-600 leading-relaxed">
          Protected by <code class="font-mono text-gray-900">Admin_Username</code> and <code class="font-mono text-gray-900">Admin_Password</code> variables.
        </p>
      </div>

      <form id="admin-login-form" class="space-y-4">
        <div>
          <label for="login-username" class="block text-xs font-semibold text-gray-700 mb-1.5">
            Admin_Username
          </label>
          <input
            id="login-username"
            name="username"
            type="text"
            autocomplete="username"
            required
            placeholder="Enter admin username"
            class="w-full h-10 px-3.5 border border-gray-300 rounded text-sm text-gray-900 focus:border-brand-500 focus:outline-none"
          />
        </div>

        <div>
          <label for="login-password" class="block text-xs font-semibold text-gray-700 mb-1.5">
            Admin_Password
          </label>
          <input
            id="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="Enter admin password"
            class="w-full h-10 px-3.5 border border-gray-300 rounded text-sm text-gray-900 focus:border-brand-500 focus:outline-none"
          />
        </div>

        <div id="login-error-msg" class="hidden p-3 bg-red-50 border border-red-200 rounded text-xs font-semibold text-red-700"></div>

        <button
          id="admin-login-submit"
          type="submit"
          class="w-full h-11 bg-gray-900 hover:bg-gray-800 text-white text-sm font-semibold rounded transition-colors"
        >
          Sign In to Admin Portal
        </button>
      </form>

      <div class="pt-3 border-t border-gray-100 flex items-center justify-between text-xs text-gray-500">
        <span>Restricted Access (/admin)</span>
        <a href="/" class="font-semibold text-brand-600 hover:underline">Return to Storefront →</a>
      </div>
    </div>
  </section>

  <!-- 2. PROTECTED ADMIN DASHBOARD -->
  <div id="admin-dashboard-view" class="hidden min-h-screen flex flex-col">
    <header class="sticky top-0 z-40 bg-white border-b border-gray-200">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
        <div>
          <span class="block font-display font-extrabold text-base sm:text-lg tracking-tight text-gray-950">
            Al-Mumtaz Electronics · Admin Portal
          </span>
          <span class="block text-[11px] font-medium text-gray-500">
            Orders, Catalog Inventory, Multi-Image Upload &amp; WhatsApp Automation
          </span>
        </div>

        <div class="flex items-center gap-2.5">
          <button id="admin-wa-link-pill" type="button" class="h-9 px-3 border border-amber-300 bg-amber-50 text-amber-800 rounded text-xs font-semibold hover:bg-amber-100">
            Link WhatsApp
          </button>
          <span id="admin-user-badge" class="hidden sm:inline-block px-2.5 py-1 bg-gray-100 border border-gray-200 rounded text-xs font-mono font-semibold text-gray-700"></span>
          <button id="admin-refresh-btn" type="button" class="h-9 px-3.5 bg-white border border-gray-300 rounded text-xs font-semibold text-gray-800 hover:bg-gray-50">
            Refresh
          </button>
          <a href="/" class="h-9 px-3.5 bg-white border border-gray-300 rounded text-xs font-semibold text-gray-800 hover:bg-gray-50 inline-flex items-center">
            Storefront
          </a>
          <button id="admin-logout-btn" type="button" class="h-9 px-3.5 bg-gray-900 hover:bg-gray-800 text-white rounded text-xs font-semibold">
            Sign Out
          </button>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-7 pb-16 space-y-6">
      <!-- KPI Summary Strip -->
      <div id="admin-kpi-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3.5"></div>

      <!-- Admin Sub-navigation Tabs -->
      <div class="flex flex-wrap gap-2 border-b border-gray-200 pb-3">
        <button type="button" data-admin-tab="orders" class="admin-tab-btn h-9 px-4 rounded text-sm font-semibold bg-gray-900 text-white">Live Orders</button>
        <button type="button" data-admin-tab="link-whatsapp" class="admin-tab-btn h-9 px-4 rounded text-sm font-semibold bg-white border border-gray-200 text-gray-700 hover:bg-gray-50">Link WhatsApp</button>
        <button type="button" data-admin-tab="products" class="admin-tab-btn h-9 px-4 rounded text-sm font-semibold bg-white border border-gray-200 text-gray-700 hover:bg-gray-50">Products &amp; Categories</button>
        <button type="button" data-admin-tab="variables" class="admin-tab-btn h-9 px-4 rounded text-sm font-semibold bg-white border border-gray-200 text-gray-700 hover:bg-gray-50">Variables &amp; Cloud Setup</button>
        <button type="button" data-admin-tab="whatsapp" class="admin-tab-btn h-9 px-4 rounded text-sm font-semibold bg-white border border-gray-200 text-gray-700 hover:bg-gray-50">Bot Tester &amp; Inquiries</button>
      </div>

      <!-- Admin Tab Mount Container -->
      <div id="admin-tab-content"></div>
    </main>
  </div>

  <!-- ORDER DETAILS MODAL -->
  <div id="order-detail-modal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-gray-200 relative">
      <button id="order-detail-close-btn" type="button" aria-label="Close order details" class="absolute right-4 top-4 w-8 h-8 rounded border border-gray-200 bg-white hover:bg-gray-100 flex items-center justify-center text-gray-700 font-bold">
        ✕
      </button>
      <div id="order-detail-body" class="p-6 space-y-5"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
