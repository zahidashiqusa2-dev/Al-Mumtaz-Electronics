<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal — Al-Mumtaz Electronics Hasilpur</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            sans: ['"DM Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            obsidian: '#11151C',
            brand: {
              50: '#FFF4EE',
              100: '#FFE5D6',
              500: '#E8531A',
              600: '#C94310',
              700: '#A5350B'
            },
            wa: {
              600: '#0F7B4D',
              700: '#0A5E3A'
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background-color: #11151C;
      color: #0F172A;
    }
    h1, h2, h3, h4, .font-display {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen bg-[#11151C] text-slate-900 antialiased">

  <!-- Toast Banner -->
  <div id="toast-banner" class="hidden fixed bottom-5 right-5 z-[60] max-w-sm bg-[#11151C] text-white px-4 py-3 rounded-xl shadow-2xl text-sm font-medium border border-slate-700"></div>

  <!-- 1. ADMIN LOGIN GATE -->
  <section id="admin-login-view" class="min-h-screen flex items-center justify-center px-4 py-12 bg-[#11151C]">
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-3xl shadow-2xl p-7 sm:p-8 space-y-6">
      <div class="flex items-center gap-3 border-b border-slate-100 pb-4">
        <div class="w-10 h-10 rounded-xl bg-[#11151C] text-white flex items-center justify-center shrink-0">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <div>
          <p class="text-[11px] font-bold uppercase tracking-[0.14em] text-brand-500">
            Al-Mumtaz Electronics · Hasilpur
          </p>
          <h1 class="font-display text-xl font-extrabold text-slate-950 tracking-tight">
            Admin Console Sign In
          </h1>
        </div>
      </div>

      <p class="text-xs text-slate-600 leading-relaxed">
        Protected by <code class="font-mono text-slate-900 bg-slate-100 px-1.5 py-0.5 rounded">Admin_Username</code> and <code class="font-mono text-slate-900 bg-slate-100 px-1.5 py-0.5 rounded">Admin_Password</code> variables.
      </p>

      <form id="admin-login-form" class="space-y-4">
        <div>
          <label for="login-username" class="block text-xs font-semibold text-slate-700 mb-1.5">
            Admin_Username
          </label>
          <input
            id="login-username"
            name="username"
            type="text"
            autocomplete="username"
            required
            placeholder="Enter admin username"
            class="w-full h-11 px-3.5 border border-slate-300 rounded-xl text-sm text-slate-900 focus:border-[#11151C] focus:outline-none"
          />
        </div>

        <div>
          <label for="login-password" class="block text-xs font-semibold text-slate-700 mb-1.5">
            Admin_Password
          </label>
          <input
            id="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="Enter admin password"
            class="w-full h-11 px-3.5 border border-slate-300 rounded-xl text-sm text-slate-900 focus:border-[#11151C] focus:outline-none"
          />
        </div>

        <div id="login-error-msg" class="hidden p-3 bg-red-50 border border-red-200 rounded-xl text-xs font-semibold text-red-700"></div>

        <button
          id="admin-login-submit"
          type="submit"
          class="w-full h-11 bg-[#11151C] hover:bg-slate-800 text-white text-sm font-semibold rounded-xl transition-colors"
        >
          Sign In to Dashboard
        </button>
      </form>

      <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
        <span>Restricted Access (/admin)</span>
        <a href="/" class="font-semibold text-brand-600 hover:underline">Return to Storefront →</a>
      </div>
    </div>
  </section>

    <div id="admin-mobile-sidebar-backdrop" class="hidden fixed inset-0 z-40 bg-black/60 lg:hidden"></div>

    <!-- Left Obsidian Sidebar Rail (Main Navigation Bar matching ProfitPulse) -->
    <aside id="admin-sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-[#11151C] text-slate-300 flex flex-col justify-between py-3.5 px-3 transform -translate-x-full lg:translate-x-0 lg:static lg:h-[calc(100vh-1.5rem)] lg:sticky lg:top-3 lg:shrink-0 transition-transform duration-200">

            <span class="block text-[10px] font-medium text-slate-400">Hasilpur Admin</span>

            <span data-nav-count="orders-all" class="text-[11px] font-mono tabular-nums opacity-70"></span>

              <svg class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1"/></svg>

            <span data-nav-count="orders-delivered" class="text-[11px] font-mono tabular-nums opacity-70"></span>

        </nav>

        <div class="border-t border-white/10 pt-2 space-y-0.5">

            <span class="flex items-center gap-2.5 min-w-0">
              <svg class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>

            <span class="flex items-center gap-2.5 min-w-0">
              <svg class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>

      <div class="space-y-0.5 pt-2 border-t border-white/10 shrink-0">
        <a href="/" class="w-full flex items-center gap-2.5 px-3 py-1.5 rounded-lg text-[12px] font-medium text-slate-400 hover:text-white hover:bg-white/5 transition-colors">
          <svg class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
          <span>View Storefront</span>
        </a>
        <button id="admin-logout-btn" type="button" class="w-full flex items-center gap-2.5 px-3 py-1.5 rounded-lg text-[12.5px] font-medium text-slate-400 hover:text-red-300 hover:bg-white/5 transition-colors">
          <svg class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>

      <header class="bg-white/90 backdrop-blur border-b border-slate-200/80 px-4 sm:px-7 h-16 sm:h-[72px] flex items-center justify-between gap-3 shrink-0">
        <div class="flex items-center gap-3 min-w-0">
          <button id="admin-sidebar-open-btn" type="button" aria-label="Open sidebar" class="lg:hidden w-9 h-9 rounded-xl border border-slate-200 bg-white flex items-center justify-center text-slate-800">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>

          <button id="admin-quick-notifs-btn" type="button" title="Bot Logs & Inquiries" aria-label="Bot Logs and Inquiries" class="w-9 h-9 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 flex items-center justify-center text-slate-700 shrink-0 transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          </button>

          <button id="admin-refresh-btn" type="button" title="Refresh Data" aria-label="Refresh Store Data" class="w-9 h-9 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 flex items-center justify-center text-slate-700 shrink-0 transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          </button>

          <!-- Admin Profile -->
          <div class="hidden sm:flex items-center gap-2.5 pl-2 border-l border-slate-200">
            <div class="w-9 h-9 rounded-full bg-amber-100 border border-amber-200 text-amber-900 font-display font-bold text-xs flex items-center justify-center shrink-0">AM</div>
            <div class="leading-tight">
              <p id="admin-user-badge" class="text-xs font-bold text-slate-950">admin</p>
              <p class="text-[11px] text-slate-500">Al-Mumtaz Store</p>
            </div>
          </div>
        </div>
      </header>

      <!-- Main Workspace Container -->
      <main class="flex-1 p-4 sm:p-6 overflow-y-auto">
        <div id="admin-tab-content" class="space-y-5"></div>
      </main>
    </div>

  <div id="order-detail-modal" class="hidden fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">

      <button id="order-detail-close-btn" type="button" aria-label="Close order details" class="absolute right-4 top-4 w-8 h-8 rounded-lg border border-slate-200 bg-white hover:bg-slate-100 flex items-center justify-center text-slate-700 font-bold">
        ✕
      </button>
      <div id="order-detail-body" class="p-6 space-y-5"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
