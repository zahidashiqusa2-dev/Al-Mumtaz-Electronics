<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal — Al-Mumtaz Electronics Hasilpur</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            sans: ['"DM Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            obsidian: '#11151C',
            brand: {
              50: '#FFF4EE',
              100: '#FFE5D6',
              500: '#E8531A',
              600: '#C94310',
              700: '#A5350B'
            },
            wa: {
              600: '#0F7B4D',
              700: '#0A5E3A'
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background-color: #11151C;
      color: #0F172A;
    }
    h1, h2, h3, h4, .font-display {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="min-h-screen bg-[#11151C] text-slate-900 antialiased">

  <!-- Toast Banner -->
  <div id="toast-banner" class="hidden fixed bottom-5 right-5 z-[60] max-w-sm bg-[#11151C] text-white px-4 py-3 rounded-xl shadow-2xl text-sm font-medium border border-slate-700"></div>

  <!-- 1. ADMIN LOGIN GATE -->
  <section id="admin-login-view" class="min-h-screen flex items-center justify-center px-4 py-12 bg-[#11151C]">
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-3xl shadow-2xl p-7 sm:p-8 space-y-6">
      <div class="flex items-center gap-3 border-b border-slate-100 pb-4">
        <div class="w-10 h-10 rounded-xl bg-[#11151C] text-white flex items-center justify-center shrink-0">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <div>
          <p class="text-[11px] font-bold uppercase tracking-[0.14em] text-brand-500">
            Al-Mumtaz Electronics · Hasilpur
          </p>
          <h1 class="font-display text-xl font-extrabold text-slate-950 tracking-tight">
            Admin Console Sign In
          </h1>
        </div>
      </div>

      <p class="text-xs text-slate-600 leading-relaxed">
        Protected by <code class="font-mono text-slate-900 bg-slate-100 px-1.5 py-0.5 rounded">Admin_Username</code> and <code class="font-mono text-slate-900 bg-slate-100 px-1.5 py-0.5 rounded">Admin_Password</code> variables.
      </p>

      <form id="admin-login-form" class="space-y-4">
        <div>
          <label for="login-username" class="block text-xs font-semibold text-slate-700 mb-1.5">
            Admin_Username
          </label>
          <input
            id="login-username"
            name="username"
            type="text"
            autocomplete="username"
            required
            placeholder="Enter admin username"
            class="w-full h-11 px-3.5 border border-slate-300 rounded-xl text-sm text-slate-900 focus:border-[#11151C] focus:outline-none"
          />
        </div>

        <div>
          <label for="login-password" class="block text-xs font-semibold text-slate-700 mb-1.5">
            Admin_Password
          </label>
          <input
            id="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="Enter admin password"
            class="w-full h-11 px-3.5 border border-slate-300 rounded-xl text-sm text-slate-900 focus:border-[#11151C] focus:outline-none"
          />
        </div>

        <div id="login-error-msg" class="hidden p-3 bg-red-50 border border-red-200 rounded-xl text-xs font-semibold text-red-700"></div>

        <button
          id="admin-login-submit"
          type="submit"
          class="w-full h-11 bg-[#11151C] hover:bg-slate-800 text-white text-sm font-semibold rounded-xl transition-colors"
        >
          Sign In to Dashboard
        </button>
      </form>

      <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
        <span>Restricted Access (/admin)</span>
        <a href="/" class="font-semibold text-brand-600 hover:underline">Return to Storefront →</a>
      </div>
    </div>
  </section>

  <!-- 2. PROTECTED ADMIN WORKSPACE (Obsidian Rail + Crisp White Canvas) -->
  <div id="admin-dashboard-view" class="hidden min-h-screen flex bg-[#11151C] lg:p-3 lg:gap-2">

    <!-- Mobile Backdrop for Sidebar -->
    <div id="admin-mobile-sidebar-backdrop" class="hidden fixed inset-0 z-40 bg-black/60 lg:hidden"></div>

    <!-- Left Obsidian Sidebar Rail -->
    <aside id="admin-sidebar" class="fixed inset-y-0 left-0 z-50 w-60 bg-[#11151C] text-slate-300 flex flex-col justify-between py-6 px-4 transform -translate-x-full lg:translate-x-0 lg:static lg:shrink-0 transition-transform duration-200">
      <div class="space-y-6">
        <!-- Brand Identity -->
        <div class="flex items-center justify-between px-2">
          <button id="admin-home-btn" type="button" class="flex items-center gap-2.5 text-left focus:outline-none group">
            <span class="w-8 h-8 rounded-lg bg-white/10 border border-white/10 text-white flex items-center justify-center shrink-0 group-hover:bg-brand-500 transition-colors">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 13l4-4 4 4 4-8 6 8" />
              </svg>
            </span>
            <span class="min-w-0">
              <span class="block font-display font-bold text-[15px] text-white tracking-tight truncate">Al-Mumtaz</span>
              <span class="block text-[10px] font-medium text-slate-400">Hasilpur Admin</span>
            </span>
          </button>
          <button id="admin-sidebar-close-btn" type="button" class="lg:hidden w-8 h-8 rounded-lg text-slate-400 hover:text-white flex items-center justify-center" aria-label="Close sidebar">✕</button>
        </div>

        <!-- Primary Navigation Links -->
        <nav class="space-y-1" aria-label="Admin primary sections">
          <button type="button" data-sidebar-tab="dashboard" class="admin-sidebar-link w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-[13px] font-medium transition-colors text-slate-400 hover:text-white hover:bg-white/5">
            <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span>Dashboard</span>
          </button>

          <button type="button" data-sidebar-tab="orders" class="admin-sidebar-link w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-[13px] font-medium transition-colors bg-white text-slate-950 font-semibold shadow-sm">
            <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
            <span>Orders</span>
          </button>

          <button type="button" data-sidebar-tab="products" class="admin-sidebar-link w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-[13px] font-medium transition-colors text-slate-400 hover:text-white hover:bg-white/5">
            <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10"/></svg>
            <span>Products</span>
          </button>

          <button type="button" data-sidebar-tab="inquiries" class="admin-sidebar-link w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-[13px] font-medium transition-colors text-slate-400 hover:text-white hover:bg-white/5">
            <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            <span>Customers</span>
          </button>

          <button type="button" data-sidebar-tab="analytics" class="admin-sidebar-link w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-[13px] font-medium transition-colors text-slate-400 hover:text-white hover:bg-white/5">
            <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
            <span>Analytics</span>
          </button>
        </nav>

        <div class="border-t border-white/10 pt-4 space-y-1">
          <button type="button" data-sidebar-tab="whatsapp" class="admin-sidebar-link w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-[13px] font-medium transition-colors text-slate-400 hover:text-white hover:bg-white/5">
            <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
            <span>Notification &amp; Bot</span>
          </button>

          <button type="button" data-sidebar-tab="link-whatsapp" class="admin-sidebar-link w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-[13px] font-medium transition-colors text-slate-400 hover:text-white hover:bg-white/5">
            <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
            <span>Link WhatsApp</span>
          </button>

          <button type="button" data-sidebar-tab="variables" class="admin-sidebar-link w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-[13px] font-medium transition-colors text-slate-400 hover:text-white hover:bg-white/5">
            <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            <span>Settings &amp; Vars</span>
          </button>
        </div>
      </div>

      <div class="space-y-2 pt-6 border-t border-white/10">
        <a href="/" class="w-full flex items-center gap-3 px-3.5 py-2 rounded-xl text-[13px] font-medium text-slate-400 hover:text-white hover:bg-white/5 transition-colors">
          <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
          <span>View Storefront</span>
        </a>
        <button id="admin-logout-btn" type="button" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-[13px] font-medium text-slate-400 hover:text-red-300 hover:bg-white/5 transition-colors">
          <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          <span>Log out</span>
        </button>
      </div>
    </aside>

    <!-- Main Rounded Off-White Workspace Frame -->
    <div class="flex-1 min-w-0 bg-[#F7F8FA] lg:rounded-[26px] flex flex-col overflow-hidden shadow-2xl">
      <!-- Top Bar Inside Frame -->
      <header class="bg-white/90 backdrop-blur border-b border-slate-200/80 px-4 sm:px-7 h-16 sm:h-[72px] flex items-center justify-between gap-3 shrink-0">
        <div class="flex items-center gap-3 min-w-0">
          <button id="admin-sidebar-open-btn" type="button" aria-label="Open sidebar" class="lg:hidden w-9 h-9 rounded-xl border border-slate-200 bg-white flex items-center justify-center text-slate-800">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <h1 id="admin-page-heading" class="font-display font-bold text-xl sm:text-2xl text-slate-950 tracking-tight truncate">Orders</h1>
        </div>

        <div class="flex items-center gap-2 sm:gap-3 shrink-0">
          <!-- Single Navigation (24) Quick-Jump Button -->
          <button id="admin-nav-toggle-btn" type="button" aria-expanded="false" aria-controls="admin-nav-drawer" class="h-9 px-3 sm:px-3.5 bg-[#11151C] hover:bg-slate-800 text-white rounded-xl text-xs font-semibold inline-flex items-center gap-2 whitespace-nowrap shrink-0 transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
            <span>Navigation (24)</span>
          </button>

          <button id="admin-quick-notifs-btn" type="button" title="Bot Logs & Inquiries" class="w-9 h-9 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 flex items-center justify-center text-slate-700 shrink-0 transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          </button>

          <button id="admin-refresh-btn" type="button" title="Refresh Data" class="w-9 h-9 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 flex items-center justify-center text-slate-700 shrink-0 transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          </button>

          <!-- Admin Profile -->
          <div class="hidden sm:flex items-center gap-2.5 pl-2 border-l border-slate-200">
            <div class="w-9 h-9 rounded-full bg-amber-100 border border-amber-200 text-amber-900 font-display font-bold text-xs flex items-center justify-center shrink-0">AM</div>
            <div class="leading-tight">
              <p id="admin-user-badge" class="text-xs font-bold text-slate-950">admin</p>
              <p class="text-[11px] text-slate-500">Al-Mumtaz Store</p>
            </div>
          </div>
        </div>
      </header>

      <!-- Collapsible 24-Button Admin Navigation Directory -->
      <section id="admin-nav-drawer" class="hidden bg-[#11151C] text-white border-b border-slate-800 shadow-2xl">
        <div id="admin-nav-drawer-inner" class="px-4 sm:px-7 py-5 space-y-4"></div>
      </section>

      <!-- Main Workspace Container -->
      <main class="flex-1 p-4 sm:p-6 overflow-y-auto">
        <div id="admin-tab-content" class="space-y-5"></div>
      </main>
    </div>
  </div>

  <!-- ORDER DETAILS MODAL -->
  <div id="order-detail-modal" class="hidden fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-200 relative">
      <button id="order-detail-close-btn" type="button" aria-label="Close order details" class="absolute right-4 top-4 w-8 h-8 rounded-lg border border-slate-200 bg-white hover:bg-slate-100 flex items-center justify-center text-slate-700 font-bold">
        ✕
      </button>
      <div id="order-detail-body" class="p-6 space-y-5"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
